<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chocolate Touch Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Nunito+Sans:wght@400;700;800&display=swap">
<style>
  /* Layout: a 1280x720 projected stage, scaled to fit. Home is a box of chocolates, one piece per chapter.
     Single committed look (cocoa + cream, same as the Ch 3 deck), so every color is set explicitly. */
  :root{
    --cocoa:#3B2318; --cocoa2:#4E3122; --cocoa3:#2A1810; --cream:#FAF4E8; --amber:#E0A15C;
    --orange:#C97B34; --green:#2E6B5E; --green-pale:#BFE0D6; --dust:#7A6656; --butter:#FFE9B8;
    --milk:#8B5534; --dark-choc:#5E331F; --ground:#16110D; --hud:#A08D7A;
    --serif:Fraunces,Georgia,"Times New Roman",serif;
    --sans:"Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--cream);font-family:var(--sans);overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:4px solid var(--amber);outline-offset:3px}

  #viewport{position:fixed;left:0;right:0;top:0;bottom:44px;overflow:hidden}
  #stage{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:0 0;border-radius:8px;overflow:hidden;background:var(--cream);box-shadow:0 24px 70px rgba(0,0,0,.55)}

  .slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:52px 68px 54px;gap:24px}
  .slide h1,.slide h2{font-family:var(--serif);font-weight:600;line-height:1.04;margin:0;text-wrap:balance}
  .slide p{margin:0}
  .s-dark{background:var(--cocoa);color:var(--cream)}
  .s-cream{background:var(--cream);color:var(--cocoa)}
  .s-butter{background:var(--butter);color:var(--cocoa)}
  .eyebrow{font-size:19px;letter-spacing:4px;font-weight:800;text-transform:uppercase;color:var(--orange)}
  .s-dark .eyebrow{color:var(--amber)}
  .title-xl{font-size:84px}
  .title-lg{font-size:62px}
  .title-md{font-size:46px}
  .lead{font-size:28px;line-height:1.35}
  .spacer{flex:1}
  .hint{font-size:17px;color:var(--dust);font-weight:700}
  .s-dark .hint{color:var(--hud)}

  /* ---------- buttons ---------- */
  .btn{border:none;border-radius:999px;padding:16px 28px;font-weight:800;font-size:22px}
  .btn.primary{background:var(--amber);color:var(--cocoa)}
  .btn.primary:hover{background:#ECB577}
  .btn.ghost{background:transparent;border:3px solid var(--amber);color:var(--amber)}
  .btn.ghost:hover{background:rgba(224,161,92,.12)}
  .btn.dark{background:var(--cocoa);color:var(--cream)}
  .btn.small{font-size:17px;padding:10px 18px}
  .btn[disabled]{opacity:.35;cursor:default}

  /* ---------- home ---------- */
  .home{flex-direction:row;align-items:center;gap:56px}
  .home .left{flex:1;display:flex;flex-direction:column;gap:22px;min-width:0}
  .home .by{font-size:21px;color:var(--hud);font-style:italic;font-family:var(--serif)}
  .gatebox{display:flex;flex-direction:column;gap:10px;background:var(--cocoa2);border-radius:16px;padding:18px 22px}
  .gatebox .lbl{font-size:18px;font-weight:800;letter-spacing:1px;color:var(--amber);text-transform:uppercase}
  .stepper{display:flex;align-items:center;gap:16px}
  .stepper b{font-family:var(--serif);font-size:34px;font-weight:600;min-width:200px;text-align:center}
  .stepper button{width:52px;height:52px;border-radius:50%;border:3px solid var(--amber);background:transparent;color:var(--amber);font-size:30px;font-weight:800;line-height:1}
  .stepper button:hover{background:rgba(224,161,92,.15)}
  .gatebox small{font-size:16px;color:var(--hud)}
  .cta{display:flex;gap:14px;flex-wrap:wrap}

  .box{width:604px;flex:none;background:var(--cocoa3);border-radius:18px;padding:18px;
       box-shadow:inset 0 0 0 4px #C9963F, inset 0 0 0 9px var(--cocoa3), inset 0 0 0 10px #6d4a2a, 0 14px 30px rgba(0,0,0,.4)}
  .box .cap{text-align:center;font-family:var(--serif);font-style:italic;color:#C9963F;font-size:17px;margin:2px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .pc{position:relative;height:132px;border:none;border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      background:radial-gradient(circle at 50% 50%, #3a2216 58%, #24140c 59%, #2f1b11 62%, #24140c 66%, #2f1b11 70%, #24140c 74%)}
  .pc .piece{width:86px;height:70px;border-radius:12px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:38px;color:var(--butter);
       background:linear-gradient(160deg,#9A603D,#6B3E26 55%,#552F1C);box-shadow:inset 0 3px 0 rgba(255,255,255,.18), inset 0 -5px 0 rgba(0,0,0,.25), 0 4px 6px rgba(0,0,0,.4);transition:transform .15s}
  .pc .nm{font-size:14px;font-weight:800;color:var(--cream);line-height:1.15;text-align:center}
  .pc:hover .piece{transform:translateY(-3px) rotate(-2deg)}
  .pc.locked .piece{color:#7a5a12;font-size:34px;background:
       repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 3px,transparent 3px 11px),
       repeating-linear-gradient(35deg,rgba(120,80,0,.22) 0 2px,transparent 2px 9px),
       linear-gradient(150deg,#F6D774,#D9A934 50%,#B8861E)}
  .pc.locked .nm{color:#C9963F}
  .pc.next .nm{color:var(--amber)}
  .pc.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* ---------- chapter title ---------- */
  .t-title{flex-direction:row;gap:46px;align-items:stretch}
  .t-title .tl{flex:1;display:flex;flex-direction:column;gap:20px;min-width:0;justify-content:center}
  .art{margin:0;width:560px;flex:none;align-self:center;border-radius:20px;overflow:hidden;border:5px solid var(--amber);background:var(--cream);line-height:0}
  .art svg{width:100%;height:auto;display:block}
  .meter{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .meter .lbl{font-size:16px;font-weight:800;letter-spacing:3px;color:var(--amber);text-transform:uppercase}
  .bar{display:flex;gap:5px;padding:6px;background:#2A1810;border-radius:10px;width:max-content}
  .bar i{width:44px;height:36px;border-radius:5px;border:2px dashed #5d4433}
  .bar i.f{border:none;background:linear-gradient(160deg,#A8693F,#6B3E26);box-shadow:inset 0 3px 0 rgba(255,255,255,.2), inset 0 -4px 0 rgba(0,0,0,.25)}
  .meter .cap{font-size:21px;color:var(--butter)}

  /* ---------- events ---------- */
  .events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;cursor:pointer}
  .events li{display:flex;gap:20px;align-items:flex-start;font-size:29px;line-height:1.3;opacity:.08;transform:translateY(8px);transition:opacity .35s,transform .35s}
  .events li.on{opacity:1;transform:none}
  .events .n{flex:none;width:52px;height:52px;border-radius:50%;background:var(--cocoa);color:var(--butter);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:27px}
  .events li>span:last-child{padding-top:6px;min-width:0}
  .events b{color:var(--green)}

  /* ---------- tap to chocolatify ---------- */
  .objs{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:center;flex:1}
  .obj{width:150px;border:3px solid #E6D6BC;background:#fff;border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .3s, transform .15s}
  .obj:hover{transform:translateY(-3px);border-color:var(--amber)}
  .objs.big .obj{width:260px}
  .ob{position:relative;width:112px;height:112px}
  .objs.big .ob{width:200px;height:200px}
  .ob svg{position:absolute;inset:0;width:100%;height:100%}
  .ob .over{clip-path:var(--from);transition:clip-path 1.4s ease-in-out}
  .obj.on .over{clip-path:var(--to)}
  .obj.on{border-color:var(--milk)}
  .ol{font-size:21px;font-weight:800;line-height:1.15;text-align:center;color:var(--cocoa)}
  .obj.on .ol{color:var(--milk)}
  .obj.stay.on{border-color:var(--green)}
  .obj.stay.on .ol{color:var(--green)}
  .obj.stay.on .ob{animation:wiggle .6s}
  @keyframes wiggle{0%,100%{transform:none}20%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}80%{transform:rotate(-3deg)}}
  .tally{font-size:22px;font-weight:800;color:var(--milk);text-align:center;min-height:30px}

  .chocv [fill]:not([fill="none"]):not(.keep){fill:var(--dark-choc)}
  .chocv .hl:not(.keep){fill:var(--milk)}
  .chocv text{fill:var(--milk)}
  .chocv .wet{stroke:var(--dark-choc)}
  .chocv [fill="none"][stroke]:not(.wet){stroke:#A8693F}

  /* ---------- flip cards ---------- */
  .flips{display:grid;gap:16px;flex:1;grid-auto-rows:1fr;min-height:0}
  .flip{perspective:1000px;border:none;background:none;padding:0;min-height:0;height:100%}
  .flip .in{display:block;position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
  .flip.on .in{transform:rotateY(180deg)}
  .flip .fc{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 16px;text-align:center}
  .flip .front{background:#fff;border:3px solid #E6D6BC;color:var(--cocoa)}
  .flip:hover .front{border-color:var(--amber)}
  .flip .back{background:var(--cocoa);color:var(--cream);transform:rotateY(180deg);font-size:20px;line-height:1.3}
  .flip .back b{color:var(--amber);font-size:21px}
  .mono{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:26px;color:var(--cream)}
  .flip .front .nm{font-size:22px;font-weight:800}
  .flip .front .tap{font-size:14px;color:var(--dust);font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .flip .word{font-family:var(--serif);font-size:42px;font-weight:600;color:var(--green)}

  /* ---------- unwrap ---------- */
  .unwrap{flex:1;display:flex;gap:44px;align-items:center}
  .unwrap .pic{width:560px;flex:none;border-radius:18px;overflow:hidden;line-height:0;border:4px solid #E6D6BC}
  .unwrap svg{width:100%;height:auto;display:block}
  .unwrap .layer{transition:opacity .5s, transform .5s}
  .unwrap .layer.gone{opacity:0;transform:translateY(-40px)}
  .unwrap .side{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
  .unwrap .msg{font-size:30px;line-height:1.3;font-weight:700;min-height:120px}
  .unwrap .cnt{font-size:18px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange)}
  .unwrap .row{display:flex;gap:12px;flex-wrap:wrap}

  /* ---------- choice ---------- */
  .choice{flex:1;display:flex;flex-direction:column;gap:26px;justify-content:center}
  .choice .opts{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .choice .opt{border:4px solid var(--amber);background:var(--cocoa2);color:var(--cream);border-radius:20px;padding:28px;font-size:30px;font-weight:800;line-height:1.25;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
  .choice .opt svg{width:110px;height:110px}
  .choice .opt:hover{background:#5c3a28}
  .choice .opt.pick{border-color:var(--butter);background:var(--green)}
  .choice .reveal{font-size:27px;line-height:1.35;background:var(--cocoa2);border-radius:16px;padding:20px 24px;color:var(--butter)}

  /* ---------- think ---------- */
  .think{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;min-height:0}
  .qs{display:flex;flex-direction:column;gap:16px;min-width:0}
  .q{background:#fff;border:3px solid #E6D6BC;border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
  .q .qt{font-size:25px;font-weight:800;line-height:1.3}
  .q .ans{font-size:22px;line-height:1.35;color:var(--green);font-weight:700}
  .q .ans em{display:block;font-style:normal;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--dust);margin-bottom:3px}
  .side2{display:flex;flex-direction:column;gap:16px;min-width:0}
  .quote{background:var(--cocoa);color:var(--cream);border-radius:16px;padding:24px 26px;display:flex;flex-direction:column;gap:10px}
  .quote p{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.3}
  .quote .src{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);font-weight:800}
  .vote{background:var(--butter);border-radius:16px;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
  .vote .vt{font-size:21px;font-weight:800}
  .vote .vb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .vote .vb button{border:3px solid var(--cocoa);background:#fff;border-radius:14px;padding:10px;font-size:21px;font-weight:800;color:var(--cocoa);display:flex;flex-direction:column;align-items:center}
  .vote .vb button b{font-family:var(--serif);font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums}
  .vote .vb button:hover{background:var(--cream)}
  .vote .clr{align-self:flex-end;border:none;background:none;font-size:15px;color:var(--dust);font-weight:700;text-decoration:underline;padding:0}

  /* ---------- recap ---------- */
  .sofar{display:grid;gap:12px 28px;flex:1;align-content:start}
  .sofar .it{display:flex;gap:16px;align-items:flex-start;min-width:0}
  .sofar .n{flex:none;width:46px;height:46px;border-radius:10px;background:linear-gradient(160deg,#9A603D,#6B3E26);color:var(--butter);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:24px}
  .sofar .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
  .sofar .tx b{font-size:20px;color:var(--green)}
  .sofar .tx span{font-size:20px;line-height:1.3}
  .sofar.big .tx b{font-size:24px}
  .sofar.big .tx span{font-size:25px}
  .chip{display:inline-block;font-size:14px;font-weight:800;color:var(--dust);margin-left:8px}
  .coll{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:center;flex:1}
  .ci{width:140px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .ci svg{width:100px;height:100px}
  .ci span{font-size:16px;font-weight:800;text-align:center;line-height:1.15}
  .ci small{font-size:13px;color:var(--dust);font-weight:700}
  .empty{flex:1;display:grid;place-items:center;text-align:center;font-size:28px;color:var(--dust);line-height:1.4}

  .frames{display:flex;flex-direction:column;gap:14px}
  .frames div{font-size:30px;background:var(--cocoa2);border-radius:14px;padding:18px 24px}
  .frames span{display:inline-block;min-width:220px;border-bottom:3px dashed var(--amber);margin:0 6px}

  /* ---------- hud ---------- */
  #hud{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;gap:10px;align-items:center;padding:0 14px calc(env(safe-area-inset-bottom,0px)) 14px;font-size:13px;color:var(--hud)}
  #hud b{color:#D9C6B0}
  #hud button{background:#2A1E16;border:1px solid #4a372a;color:#E6D6BC;border-radius:8px;padding:5px 12px;font-size:14px;font-weight:700}
  #hud button:hover{border-color:var(--amber)}
  #hud .keys{margin-left:auto}
  @media (max-width:700px){#hud .keys{display:none}}
  #toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);background:#2A1E16;border:1px solid var(--amber);color:#F2E6D6;border-radius:10px;padding:12px 18px;font-size:15px;max-width:min(560px,90vw);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.on{opacity:1}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>

<div id="viewport"><div id="stage" role="region" aria-live="polite"></div></div>
<div id="hud">
  <button id="bHome" type="button">Box</button>
  <button id="bPrev" type="button">◀ Back</button>
  <button id="bNext" type="button">Next ▶</button>
  <span id="where"></span>
  <span class="keys"><b>← →</b> move &nbsp; <b>H</b> box &nbsp; <b>F</b> full screen</span>
</div>
<div id="toast"></div>

<script>
/* ================= drawings ================= */
const S = '#3B2318';
const I = {

  store:`<rect x="6" y="20" width="88" height="10" fill="#7A2E1F"/><rect x="10" y="30" width="80" height="64" fill="#B5462F"/><path d="M10 40 H90 M10 50 H90 M10 60 H90 M10 70 H90 M10 80 H90" fill="none" stroke="#9A3826" stroke-width="1.5"/><path d="M10 38 h80 l-5 11 h-70z" fill="#FAF4E8"/><path d="M22 38 l-2 11 M38 38 l-1 11 M54 38 l0 11 M70 38 l1 11" fill="none" stroke="#C0392B" stroke-width="5"/><rect x="14" y="55" width="26" height="24" fill="#FFE9B8"/><rect x="60" y="55" width="26" height="24" fill="#FFE9B8"/><rect x="43" y="57" width="14" height="37" fill="#4E3122"/><circle cx="21" cy="71" r="4" fill="#C0392B" stroke-width="1.5"/><circle cx="30" cy="70" r="4" fill="#6B3E26" stroke-width="1.5"/><circle cx="67" cy="71" r="4" fill="#F28AB2" stroke-width="1.5"/><circle cx="77" cy="70" r="4" fill="#6B3E26" stroke-width="1.5"/><text x="50" y="28.5" text-anchor="middle" font-family="Nunito Sans,Arial,sans-serif" font-weight="800" font-size="8" fill="#FFE9B8" stroke="none">CANDY</text>`,

/* ================= state ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let gate = store.get('ct-gate', 4);
let votes = store.get('ct-votes', {});
let deck = null, idx = 0, step = 0;
const stage = document.getElementById('stage');

/* ================= slide builders ================= */
function homeSlide() {
  const pieces = CH.map(c => {
    const open = c.n <= gate, next = c.n === gate + 1;
    return `<button type="button" class="pc ${open ? '' : 'locked'} ${next ? 'next' : ''}" data-ch="${c.n}" aria-label="Chapter ${c.n}${open ? ', ' + c.short : ', still wrapped'}">
      <span class="piece">${open ? c.n : '?'}</span><span class="nm">${open ? c.short : next ? 'Up next' : 'Ch ' + c.n}</span></button>`;
  }).join('');
  const last = CH[gate - 1];
  return { html: `<div class="slide s-dark home">
    <div class="left">
      <div class="eyebrow">Story recap</div>
      <h1 class="title-xl">The Chocolate Touch</h1>
      <p class="by">by Patrick Skene Catling</p>
      <div class="gatebox">
        <span class="lbl">We’ve finished up to</span>
        <div class="stepper"><button type="button" data-act="gm" aria-label="One chapter fewer">−</button><b>${gate ? 'Chapter ' + gate : 'Not started'}</b><button type="button" data-act="gp" aria-label="One chapter more">+</button></div>
        <small>Chapters after that stay wrapped, so nothing gets spoiled.</small>
      </div>
      <div class="cta">
        ${last ? `<button type="button" class="btn primary" data-act="last">Recap Chapter ${gate} →</button><button type="button" class="btn ghost" data-act="sofar">The story so far</button>`
               : `<button type="button" class="btn primary" disabled>Finish Chapter 1 to start</button>`}
      </div>
    </div>
    <div class="box"><div class="cap">Pick a chocolate, any chocolate</div><div class="grid">${pieces}</div></div>
  </div>`, mount(el) {
    el.querySelectorAll('.pc').forEach(b => b.onclick = () => {
      const n = +b.dataset.ch;
      if (n <= gate) return openChapter(n);
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      toast(`Chapter ${n} is still wrapped. Press + above when your group has read it.`);
    });
    el.querySelector('[data-act=gm]').onclick = () => setGate(gate - 1);
    el.querySelector('[data-act=gp]').onclick = () => setGate(gate + 1);
    const l = el.querySelector('[data-act=last]'); if (l) l.onclick = () => openChapter(gate);
    const s = el.querySelector('[data-act=sofar]'); if (s) s.onclick = openSoFar;
  }};
}

function titleSlide(c) {
  const bar = Array.from({ length: 7 }, (_, i) => `<i class="${i < c.magic ? 'f' : ''}"></i>`).join('');
  return { html: `<div class="slide s-dark t-title">
    <div class="tl">
      <div class="eyebrow">Chapter ${c.n}</div>
      <h1 class="title-lg">${c.name}</h1>
      <p class="lead">${c.one}</p>
      <div class="meter"><span class="lbl">How strong is the magic?</span><div class="bar" aria-hidden="true">${bar}</div><span class="cap">${c.end || MAGIC[c.magic]}</span></div>
    </div>
    <figure class="art">${ART[c.n]()}</figure>
  </div>` };
}

function eventsSlide(c) {
  return { steps: c.events.length, html: `<div class="slide s-cream">
    <div class="eyebrow">Chapter ${c.n} · ${c.name}</div>
    <h2 class="title-md">What happened?</h2>
    <ol class="events">${c.events.map((e, i) => `<li><span class="n">${i + 1}</span><span>${e}</span></li>`).join('')}</ol>
    <div class="spacer"></div>
    <p class="hint">Tap the list or press → to show the next part.</p>
  </div>`, mount(el) { el.querySelector('.events').onclick = next; } };
}

function objHTML([k, label, from, to, after, chocFrom, stay]) {
  const f = from || 'inset(0 0 100% 0)', t = to || 'inset(0 0 0 0)';
  return `<button type="button" class="obj ${stay ? 'stay' : ''}" data-after="${after || 'Chocolate ' + label.toLowerCase()}" data-label="${label}">
    <span class="ob"><svg viewBox="0 0 100 100" aria-hidden="true">${g(k)}</svg>${stay ? '' : `<svg viewBox="0 0 100 100" class="chocv over" style="--from:${chocFrom || f};--to:${t}" aria-hidden="true">${g(k)}</svg>`}</span>
    <span class="ol">${label}</span></button>`;
}

function playSlide(c, p) {
  const head = `<div class="eyebrow">Chapter ${c.n} · Try it</div><h2 class="title-md">${p.title}</h2><p class="lead" style="font-size:24px">${p.prompt}</p>`;
  if (p.type === 'tap') return { html: `<div class="slide s-butter">${head}
      <div class="objs ${p.big ? 'big' : ''}">${p.items.map(objHTML).join('')}</div><div class="tally" aria-live="polite"></div></div>`,
    mount(el) {
      const objs = [...el.querySelectorAll('.obj')], tally = el.querySelector('.tally');
      objs.forEach(o => o.onclick = () => {
        const on = o.classList.toggle('on');
        o.querySelector('.ol').textContent = on ? o.dataset.after : o.dataset.label;
        const n = objs.filter(x => x.classList.contains('on')).length;
        if (o.classList.contains('stay')) tally.textContent = on ? 'Nothing turned to chocolate. Hooray!' : '';
        else tally.textContent = n ? (n === objs.length ? (objs.length > 1 ? `All ${n} turned to chocolate!` : '') : `${n} of ${objs.length} turned to chocolate`) : '';
      });
    } };
  if (p.type === 'flip') return { html: `<div class="slide s-butter">${head}
      <div class="flips" style="grid-template-columns:repeat(${p.cols},1fr)">${p.cards.map(([m, nm, col, back]) => `<button type="button" class="flip" aria-label="${nm}"><span class="in">
        <span class="fc front">${p.words ? `<span class="word">${nm}</span>` : `<span class="mono" style="background:${col}">${m}</span><span class="nm">${nm}</span>`}<span class="tap">Tap to flip</span></span>
        <span class="fc back">${p.words ? '' : `<b>${nm}</b>`}<span>${back}</span></span></span></button>`).join('')}</div></div>`,
    mount(el) { el.querySelectorAll('.flip').forEach(f => f.onclick = () => f.classList.toggle('on')); } };
  if (p.type === 'unwrap') return unwrapSlide(c, head);
  if (p.type === 'choice') return { html: `<div class="slide s-dark">
      <div class="eyebrow">Chapter ${c.n} · Try it</div><h2 class="title-md">${p.title}</h2><p class="lead" style="font-size:24px">${p.prompt}</p>
      <div class="choice"><div class="opts">
        <button type="button" class="opt" data-o="a"><svg viewBox="0 0 100 100" aria-hidden="true">${g('chocbar')}</svg>Get rid of the chocolate touch</button>
        <button type="button" class="opt" data-o="b"><svg viewBox="0 0 100 100" aria-hidden="true">${g('heart')}</svg>Help Mom</button>
      </div><div class="reveal" hidden></div></div></div>`,
    mount(el) {
      const r = el.querySelector('.reveal');
      el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        el.querySelectorAll('.opt').forEach(x => x.classList.toggle('pick', x.dataset.o === 'b'));
        r.hidden = false;
        r.innerHTML = (b.dataset.o === 'a' ? 'That’s what the old John might have picked. ' : 'Same as John! ') +
          'For one moment John pictured a life of chocolate meals. Then he thought of his mom, and said: <b>“Help my mother.”</b>';
      });
    } };
}

    ['the lid', `<rect width="400" height="300" fill="#C0392B"/><path d="M180 0 V300 M0 150 H400" stroke="#E0A15C" stroke-width="22"/><path d="M200 150 c-60 -70 -110 -10 0 0 c60 -70 110 -10 0 0" fill="#E0A15C" stroke="${S}" stroke-width="3"/>`],
    ['a sheet of cardboard', `<rect width="400" height="300" fill="#C9A47A"/>` + Array.from({ length: 14 }, (_, i) => `<path d="M0 ${12 + i * 21} H400" stroke="#B48E62" stroke-width="2"/>`).join('')],
    ['a square of heavy tin foil', `<rect width="400" height="300" fill="#C8CDD2"/><path d="M0 40 L90 90 L60 180 L150 230 L120 300 M90 90 L210 60 L260 150 L150 230 M210 60 L300 0 M260 150 L400 120 M260 150 L330 300 M60 180 L0 200" stroke="#A3AAB1" stroke-width="3" fill="none"/><path d="M40 30 L120 80 M230 70 L280 140" stroke="#F4F6F8" stroke-width="5"/>`],
    ['a layer of shredded paper', `<rect width="400" height="300" fill="#F3D59A"/>` + Array.from({ length: 34 }, (_, i) => { const x = (i * 73) % 400, y = (i * 47) % 300; return `<path d="M${x} ${y} q12 -14 24 0 t24 0" fill="none" stroke="${['#E0A15C', '#E58FA0', '#fff'][i % 3]}" stroke-width="5" stroke-linecap="round"/>`; }).join('')],
    ['the cotton', `<rect width="400" height="300" fill="#F7F3EA"/>` + Array.from({ length: 22 }, (_, i) => `<circle cx="${(i * 89) % 400}" cy="${(i * 53) % 300}" r="${28 + (i % 4) * 8}" fill="#fff" stroke="#E6DED0" stroke-width="2"/>`).join('') + `<circle cx="200" cy="150" r="20" fill="#E8B83A" stroke="${S}" stroke-width="3"/>`],
    ['the gold paper', `<rect width="400" height="300" fill="#FAF4E8"/><circle cx="200" cy="150" r="20" fill="#E8B83A" stroke="${S}" stroke-width="3"/><path d="M190 142 q4 -6 10 -6" stroke="#FFF3C4" stroke-width="3" fill="none"/>`]
  ];
  const base = `<rect width="400" height="300" fill="#FAF4E8"/><circle cx="200" cy="150" r="9" fill="#6B3E26" stroke="${S}" stroke-width="2.5"/><path d="M196 147 q2 -3 5 -3" stroke="#A8693F" stroke-width="2" fill="none"/>`;
  const layers = L.map((l, i) => `<g class="layer" data-i="${i}">${l[1]}</g>`).reverse().join('');
  return { html: `<div class="slide s-butter">${head}
    <div class="unwrap">
      <div class="pic"><svg viewBox="0 0 400 300" role="img" aria-label="The candy box">${base}${layers}</svg></div>

    </div></div>`,
  mount(el) {
    let k = 0; const msg = el.querySelector('.msg'), cnt = el.querySelector('.k'), go = el.querySelector('[data-a=go]');
    go.onclick = () => {
      if (k >= L.length) return;
      el.querySelector(`.layer[data-i="${k}"]`).classList.add('gone');
      msg.textContent = k === L.length - 1 ? 'One tiny piece of plain chocolate. That’s the only one in the whole box!' : `John took off ${L[k][0]}…`;

    };
    el.querySelector('[data-a=re]').onclick = () => {
      k = 0; cnt.textContent = 0; go.disabled = false;
      el.querySelectorAll('.layer').forEach(x => x.classList.remove('gone'));
      msg.textContent = 'A giant box, as big as the ones Dad brings home at Christmas. What’s inside?';
    };
  } };
}

function thinkSlide(c) {
  const v = votes[c.n] || { l: 0, u: 0 };
  return { html: `<div class="slide s-cream">
    <div class="eyebrow">Chapter ${c.n} · Talk about it</div>
    <div class="think">
      <div class="qs">${c.qs.map(([q, a]) => `<div class="q"><span class="qt">${q}</span><button type="button" class="btn small dark" style="align-self:flex-start">Show an idea</button><span class="ans" hidden><em>One idea</em>${a}</span></div>`).join('')}</div>
      <div class="side2">
        <div class="quote"><span class="src">From the book</span><p>${c.quote.startsWith('“') ? c.quote : '“' + c.quote + '”'}</p>${c.quoteBy ? `<span class="src" style="color:var(--hud)">${c.quoteBy}</span>` : ''}</div>
        <div class="vote"><span class="vt">After Chapter ${c.n}, is John lucky or unlucky?</span>
          <div class="vb"><button type="button" data-v="l"><b>${v.l}</b>Lucky</button><button type="button" data-v="u"><b>${v.u}</b>Unlucky</button></div>
          <button type="button" class="clr">Clear votes</button></div>
      </div>
    </div></div>`,
  mount(el) {
    el.querySelectorAll('.q').forEach(q => q.querySelector('button').onclick = e => { q.querySelector('.ans').hidden = false; e.currentTarget.remove(); });
    const paint = () => { const v = votes[c.n] || { l: 0, u: 0 }; el.querySelector('[data-v=l] b').textContent = v.l; el.querySelector('[data-v=u] b').textContent = v.u; };
    el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const v = votes[c.n] || { l: 0, u: 0 }; v[b.dataset.v]++; votes[c.n] = v; store.set('ct-votes', votes); paint(); });
    el.querySelector('.clr').onclick = () => { delete votes[c.n]; store.set('ct-votes', votes); paint(); };
  } };
}

function upNextSlide(c) {
  if (c.n === 12) return { html: `<div class="slide s-dark" style="justify-content:center">
    <div class="eyebrow">The end</div><h1 class="title-lg">You finished the book!</h1>
    <div class="frames"><div>My favorite part was <span></span> because <span></span>.</div><div>The lesson John learned is <span></span>.</div></div></div>` };
  return { html: `<div class="slide s-dark" style="justify-content:center">
    <div class="eyebrow">Up next</div><h1 class="title-lg">Ready for Chapter ${c.n + 1}?</h1>
    <p class="lead">Make a prediction before we read.</p>
    <div class="frames"><div>I think John will <span></span>.</div><div>I think this because <span></span>.</div></div></div>` };
}

function soFarSlides() {
  const done = CH.filter(c => c.n <= gate);
  const list = { html: `<div class="slide s-cream">
    <div class="eyebrow">Chapters 1 to ${gate}</div><h2 class="title-md">The story so far</h2>
    <div class="sofar ${done.length <= 5 ? 'big' : ''}" style="grid-template-columns:${done.length > 6 ? '1fr 1fr' : '1fr'}">${done.map(c => {
      const v = votes[c.n];
      return `<div class="it"><span class="n">${c.n}</span><span class="tx"><b>${c.name}${v ? `<span class="chip">Lucky ${v.l} · Unlucky ${v.u}</span>` : ''}</b><span>${c.one}</span></span></div>`;
    }).join('')}</div></div>` };
  const items = done.flatMap(c => (COLL[c.n] || []).map(x => [...x, c.n]));
  const coll = { html: `<div class="slide s-butter">
    <div class="eyebrow">Chapters 1 to ${gate}</div><h2 class="title-md">${items.length ? `${items.length} things have turned to chocolate` : 'The chocolate collection'}</h2>
    ${items.length ? `<div class="coll">${items.map(([k, l, n]) => `<div class="ci"><svg viewBox="0 0 100 100" class="chocv" aria-hidden="true">${g(k)}</svg><span>${l}</span><small>Ch ${n}</small></div>`).join('')}</div>`
      : `<div class="empty">Nothing has turned to chocolate yet.<br>So far John has only eaten one magic chocolate…</div>`}
  </div>` };
  return [list, coll];
}

/* ================= decks + navigation ================= */
function chapterSlides(c) {
  const s = [titleSlide(c), eventsSlide(c), ...c.play.map(p => playSlide(c, p)), thinkSlide(c)];
  if (c.n === gate) s.push(upNextSlide(c));
  return s;
}
function openHome() { deck = { kind: 'home', slides: [homeSlide()] }; idx = 0; render(); }
function openChapter(n, at = 0) { deck = { kind: 'ch', n, slides: chapterSlides(CH[n - 1]) }; idx = at < 0 ? deck.slides.length - 1 : at; step = 0; render(); }
function openSoFar() { deck = { kind: 'sofar', slides: soFarSlides() }; idx = 0; render(); }
function setGate(n) { gate = Math.max(0, Math.min(12, n)); store.set('ct-gate', gate); openHome(); }

function render() {
  const s = deck.slides[idx];
  stage.innerHTML = s.html;
  const el = stage.firstElementChild;
  if (s.steps) paintSteps(el);
  if (s.mount) s.mount(el);
  const w = document.getElementById('where');
  w.innerHTML = deck.kind === 'home' ? '<b>The chocolate box</b>' :
    deck.kind === 'ch' ? `<b>Chapter ${deck.n}</b> · ${idx + 1} / ${deck.slides.length}` : `<b>Story so far</b> · ${idx + 1} / ${deck.slides.length}`;
}
function paintSteps(el) { el.querySelectorAll('.events li').forEach((li, i) => li.classList.toggle('on', i < step)); }

function next() {
  const s = deck.slides[idx];
  if (s.steps && step < s.steps) { step++; paintSteps(stage.firstElementChild); return; }
  if (idx < deck.slides.length - 1) { idx++; step = 0; render(); return; }
  if (deck.kind === 'ch' && deck.n < gate) return openChapter(deck.n + 1);
  openHome();
}
function prev() {
  if (deck.kind === 'home') return;
  if (idx > 0) { idx--; const s = deck.slides[idx]; step = s.steps || 0; render(); return; }
  if (deck.kind === 'ch' && deck.n > 1) { openChapter(deck.n - 1, -1); return; }
  openHome();
}

let tt;
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2600); }

function fit() {
  const vp = document.getElementById('viewport'), W = vp.clientWidth, H = vp.clientHeight;
  const s = Math.min(W / 1280, H / 720) * .98;
  stage.style.transform = `translate(${(W - 1280 * s) / 2}px,${(H - 720 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit);
document.getElementById('bHome').onclick = openHome;
document.getElementById('bPrev').onclick = prev;
document.getElementById('bNext').onclick = next;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && e.target === document.body)) { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
  else if (k === 'h' || k === 'H' || k === 'Escape' || k === 'Home') openHome();
  else if (k === 'f' || k === 'F') {
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (err) {}
  }
});
fit(); openHome();
</script>
